<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Nexus is the launcher for every system running on the Harith Kavish ecosystem.">
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1014" media="(prefers-color-scheme: dark)">
    <meta property="og:site_name" content="Harith Kavish">
    <meta property="og:title" content="Nexus">
    <meta property="og:description" content="Connected systems. One place.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nexus.harithkavish.com/">
    <meta property="og:image" content="https://harithkavish.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Nexus">
    <meta name="twitter:description" content="Connected systems. One place.">
    <meta name="twitter:image" content="https://harithkavish.com/favicon.svg">
    <link rel="canonical" href="https://nexus.harithkavish.com/">
    <link rel="icon" href="https://harithkavish.com/favicon.svg" type="image/svg+xml">
    <!-- Shared theme from the main site, so Nexus follows it automatically. -->
    <link rel="stylesheet" href="https://harithkavish.com/style.css">
    <style>
        /* The only component the shared theme doesn't have: an app tile. Built from its tokens. */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }

        .app-tile {
            display: flex;
            align-items: center;
            /* Wide enough that the oversized icon still clears the text. */
            gap: 1.35rem;
            min-width: 0;
            padding: 1rem 1.1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1.4rem;
            box-shadow: var(--shadow);
        }

        .app-tile:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-strong);
        }

        /* A small backing plate — the icon itself sits proud of it. */
        .app-tile__icon {
            position: relative;
            flex: none;
            width: 1.9rem;
            height: 1.9rem;
            border: 1px solid var(--border);
            border-radius: 0.6rem;
            background: var(--pill-bg);
            --icon-lift: rgba(15, 23, 42, 0.22);
        }

        :root[data-theme='dark'] .app-tile__icon {
            --icon-lift: rgba(0, 0, 0, 0.45);
        }

        /* The site's own favicon, revealed only once it actually loads. */
        .app-tile__favicon {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 3.25rem;
            height: 3.25rem;
            object-fit: contain;
            transform: translate(-50%, -50%) translateY(-0.35rem);
            filter: drop-shadow(0 6px 12px var(--icon-lift));
            opacity: 0;
            transition: opacity 160ms ease, transform 160ms ease;
        }

        .app-tile__favicon.is-loaded {
            opacity: 1;
        }

        .app-tile:hover .app-tile__favicon {
            transform: translate(-50%, -50%) translateY(-0.55rem);
        }

        .app-tile__text {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .app-tile__name {
            font-weight: 650;
        }

        .app-tile__meta {
            color: var(--muted);
            font-size: 0.85rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
    <script>
        document.documentElement.dataset.theme = localStorage.getItem('harithkavish-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <title>Nexus — Harith Kavish</title>
</head>
<body data-page="nexus">
    <div class="site-shell">
        <header class="site-header">
            <div class="site-header__inner">
                <a class="brand" href="https://harithkavish.com/">
                    <img class="brand__mark" src="https://harithkavish.com/logo.png" alt="" aria-hidden="true">
                    <span class="brand__text">
                        <span class="brand__name">Harith Kavish</span>
                        <span class="brand__descriptor">Nexus</span>
                    </span>
                </a>
                <div class="site-header__actions">
                    <button type="button" class="theme-toggle" data-theme-toggle="true" aria-label="Switch to dark mode">Dark mode</button>
                </div>
            </div>
        </header>

        <main class="site-main">
            <div class="section-head">
                <h1 class="section-head__title">Nexus</h1>
                <p class="section-head__lead">Connected systems. One place.</p>
            </div>

            <!-- To add a system: copy one tile and change the link, origin, name and host. -->
            <div class="app-grid">
                <a class="app-tile" href="https://vm.harithkavish.com">
                    <span class="app-tile__icon" aria-hidden="true">
                        <img class="app-tile__favicon" data-origin="https://vm.harithkavish.com" alt="" decoding="async">
                    </span>
                    <span class="app-tile__text">
                        <span class="app-tile__name">VM</span>
                        <span class="app-tile__meta">vm.harithkavish.com</span>
                    </span>
                </a>

                <a class="app-tile" href="https://vr.harithkavish.com">
                    <span class="app-tile__icon" aria-hidden="true">
                        <img class="app-tile__favicon" data-origin="https://vr.harithkavish.com" alt="" decoding="async">
                    </span>
                    <span class="app-tile__text">
                        <span class="app-tile__name">VR</span>
                        <span class="app-tile__meta">vr.harithkavish.com</span>
                    </span>
                </a>
            </div>
        </main>

        <footer class="site-footer">
            <div class="site-footer__inner">
                <p class="site-footer__copy">© <span data-year>2026</span> Harith Kavish</p>
                <nav class="site-footer__nav" aria-label="Footer">
                    <a class="site-nav__link" href="https://harithkavish.com/">Home</a>
                    <a class="site-nav__link" href="https://harithkavish.com/status.html">Status</a>
                    <a class="site-nav__link" href="https://harithkavish.com/legal.html">Legal</a>
                </nav>
            </div>
        </footer>
    </div>

    <script>
        (function () {
            var key = 'harithkavish-theme';
            var button = document.querySelector('[data-theme-toggle]');

            function applyTheme(theme, persist) {
                document.documentElement.dataset.theme = theme;
                if (persist) {
                    localStorage.setItem(key, theme);
                }
                button.textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
                button.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
            }

            applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light', false);

            button.addEventListener('click', function () {
                applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
            });

            document.querySelector('[data-year]').textContent = new Date().getFullYear();

            // Whatever icon a system serves, in the order browsers themselves look.
            var iconPaths = ['/favicon.svg', '/favicon.ico', '/favicon.png', '/apple-touch-icon.png'];

            document.querySelectorAll('.app-tile__favicon').forEach(function (icon) {
                var origin = icon.dataset.origin;
                var attempt = 0;

                function tryNext() {
                    // Nothing served an icon, so the tile keeps an empty mark.
                    if (attempt < iconPaths.length) {
                        icon.src = origin + iconPaths[attempt++];
                    }
                }

                icon.addEventListener('load', function () {
                    icon.classList.add('is-loaded');
                });
                icon.addEventListener('error', tryNext);
                tryNext();
            });
        })();
    </script>
</body>
</html>
