<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Nexus is the launcher for every system running on the Harith Kavish ecosystem.">
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1014" media="(prefers-color-scheme: dark)">
    <meta property="og:site_name" content="Harith Kavish">
    <meta property="og:title" content="Nexus">
    <meta property="og:description" content="Connected systems. One place.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nexus.harithkavish.com/">
    <meta property="og:image" content="https://harithkavish.com/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Nexus">
    <meta name="twitter:description" content="Connected systems. One place.">
    <meta name="twitter:image" content="https://harithkavish.com/favicon.svg">
    <link rel="canonical" href="https://nexus.harithkavish.com/">
    <link rel="icon" href="https://harithkavish.com/favicon.svg" type="image/svg+xml">
    <!-- Shared theme from the main site, so Nexus follows it automatically. -->
    <link rel="stylesheet" href="https://harithkavish.com/style.css">
    <style>
        /* The only component the shared theme doesn't have: an app tile. Built from its tokens. */
        .app-grid {
            display: grid;
            /* Fixed tracks rather than 1fr, so tiles stay sized to the logo
               instead of stretching to fill the row. */
            grid-template-columns: repeat(auto-fill, min(100%, 170px));
            gap: 0.85rem;
        }

        /* The logo leads: centred, large, with the name reading as its caption. */
        .app-tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            min-width: 0;
            padding: 0.5rem 0.5rem 0.95rem;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1.4rem;
            box-shadow: var(--shadow);
        }

        .app-tile:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-strong);
        }

        .app-tile__icon {
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            aspect-ratio: 1;
            max-width: 9.49rem;
        }

        /* Only for a system serving no icon, so its tile still reads as a tile. */
        .app-tile__icon.is-empty::after {
            content: '';
            width: 42%;
            height: 42%;
            border: 1px dashed var(--border);
            border-radius: 1.1rem;
        }

        /* The site's own favicon, revealed only once it actually loads. */
        .app-tile__favicon {
            /* Fills the box rather than resting at its own intrinsic size. */
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 160ms ease;
        }

        .app-tile__favicon.is-loaded {
            opacity: 1;
        }

        .app-tile__text {
            display: flex;
            flex-direction: column;
            gap: 0.05rem;
            min-width: 0;
            max-width: 100%;
        }

        .app-tile__name {
            font-size: 1.05rem;
            font-weight: 650;
        }

        .app-tile__meta {
            color: var(--muted);
            font-size: 0.82rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
    <script>
        document.documentElement.dataset.theme = localStorage.getItem('harithkavish-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <title>Nexus — Harith Kavish</title>
</head>
<body data-page="nexus">
    <div class="site-shell">
        <header class="site-header">
            <div class="site-header__inner">
                <a class="brand" href="https://harithkavish.com/">
                    <img class="brand__mark" src="https://harithkavish.com/logo.png" alt="" aria-hidden="true">
                    <span class="brand__text">
                        <span class="brand__name">Harith Kavish</span>
                        <span class="brand__descriptor">Nexus</span>
                    </span>
                </a>
                <div class="site-header__actions">
                    <button type="button" class="theme-toggle" data-theme-toggle="true" aria-label="Switch to dark mode">Dark mode</button>
                </div>
            </div>
        </header>

        <main class="site-main">
            <div class="section-head">
                <h1 class="section-head__title">Nexus</h1>
                <p class="section-head__lead">Connected systems. One place.</p>
            </div>

            <!-- To add a system: copy one tile and change the link, origin, name and host. -->
            <div class="app-grid">
                <a class="app-tile" href="https://vm.harithkavish.com">
                    <span class="app-tile__icon" aria-hidden="true">
                        <img class="app-tile__favicon" data-origin="https://vm.harithkavish.com" alt="" decoding="async">
                    </span>
                    <span class="app-tile__text">
                        <span class="app-tile__name">VM</span>
                        <span class="app-tile__meta">vm.harithkavish.com</span>
                    </span>
                </a>

                <a class="app-tile" href="https://vr.harithkavish.com">
                    <span class="app-tile__icon" aria-hidden="true">
                        <img class="app-tile__favicon" data-origin="https://vr.harithkavish.com" alt="" decoding="async">
                    </span>
                    <span class="app-tile__text">
                        <span class="app-tile__name">VR</span>
                        <span class="app-tile__meta">vr.harithkavish.com</span>
                    </span>
                </a>

                <a class="app-tile" href="https://forge.harithkavish.com">
                    <span class="app-tile__icon" aria-hidden="true">
                        <img class="app-tile__favicon" data-origin="https://forge.harithkavish.com" alt="" decoding="async">
                    </span>
                    <span class="app-tile__text">
                        <span class="app-tile__name">Forge</span>
                        <span class="app-tile__meta">forge.harithkavish.com</span>
                    </span>
                </a>
            </div>
        </main>

        <footer class="site-footer">
            <div class="site-footer__inner">
                <p class="site-footer__copy">© <span data-year>2026</span> Harith Kavish</p>
                <nav class="site-footer__nav" aria-label="Footer">
                    <a class="site-nav__link" href="https://harithkavish.com/">Home</a>
                    <a class="site-nav__link" href="https://harithkavish.com/status.html">Status</a>
                    <a class="site-nav__link" href="https://harithkavish.com/legal.html">Legal</a>
                </nav>
            </div>
        </footer>
    </div>

    <script>
        (function () {
            var key = 'harithkavish-theme';
            var button = document.querySelector('[data-theme-toggle]');

            function applyTheme(theme, persist) {
                document.documentElement.dataset.theme = theme;
                if (persist) {
                    localStorage.setItem(key, theme);
                }
                button.textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
                button.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
            }

            applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light', false);

            button.addEventListener('click', function () {
                applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
            });

            document.querySelector('[data-year]').textContent = new Date().getFullYear();

            // Whatever icon a system serves, highest fidelity first: a vector, then
            // the large PNGs, leaving the usually-tiny .ico as a last resort.
            var iconPaths = [
                '/favicon.svg',
                '/icon.png',
                '/icon-512.png',
                '/icon-192.png',
                '/apple-touch-icon.png',
                '/apple-icon.png',
                '/favicon.png',
                '/favicon.ico'
            ];

            /*
             * Logos are drawn with varying amounts of blank margin baked into the
             * image. Measure where the artwork actually starts and ends, then scale
             * it so the artwork — not its canvas — fills the tile.
             */
            function fillWithArtwork(icon, src) {
                var probe = new Image();

                probe.addEventListener('load', function () {
                    var size = 64;
                    var width = probe.naturalWidth;
                    var height = probe.naturalHeight;
                    if (!width || !height) {
                        return;
                    }

                    try {
                        var canvas = document.createElement('canvas');
                        canvas.width = size;
                        canvas.height = size;
                        var context = canvas.getContext('2d', { willReadFrequently: true });

                        // Match how the tile draws it, so the bounds map straight across.
                        var fit = Math.min(size / width, size / height);
                        var drawWidth = width * fit;
                        var drawHeight = height * fit;
                        context.drawImage(
                            probe,
                            (size - drawWidth) / 2,
                            (size - drawHeight) / 2,
                            drawWidth,
                            drawHeight
                        );

                        var pixels = context.getImageData(0, 0, size, size).data;
                        var minX = size;
                        var minY = size;
                        var maxX = -1;
                        var maxY = -1;

                        for (var y = 0; y < size; y++) {
                            for (var x = 0; x < size; x++) {
                                if (pixels[(y * size + x) * 4 + 3] > 12) {
                                    if (x < minX) { minX = x; }
                                    if (x > maxX) { maxX = x; }
                                    if (y < minY) { minY = y; }
                                    if (y > maxY) { maxY = y; }
                                }
                            }
                        }

                        if (maxX < 0) {
                            return;
                        }

                        var scale = 1 / Math.max((maxX - minX + 1) / size, (maxY - minY + 1) / size);

                        // Already edge to edge, or so sparse that filling would distort it.
                        if (scale <= 1.02 || scale > 2.5) {
                            return;
                        }

                        var shiftX = ((minX + maxX + 1) / 2 / size - 0.5) * scale * 100;
                        var shiftY = ((minY + maxY + 1) / 2 / size - 0.5) * scale * 100;

                        icon.style.transform =
                            'translate(' + (-shiftX).toFixed(2) + '%, ' + (-shiftY).toFixed(2) + '%)' +
                            ' scale(' + scale.toFixed(3) + ')';
                    } catch (error) {
                        // The image blocked a pixel read, so it stays exactly as served.
                    }
                });

                // Measured on a separate request so a missing CORS header cannot
                // stop the visible logo from loading.
                probe.crossOrigin = 'anonymous';
                probe.src = src;
            }

            document.querySelectorAll('.app-tile__favicon').forEach(function (icon) {
                var origin = icon.dataset.origin;
                var attempt = 0;

                function tryNext() {
                    if (attempt < iconPaths.length) {
                        icon.src = origin + iconPaths[attempt++];
                    } else {
                        // Nothing served an icon, so the tile keeps an empty mark.
                        icon.parentNode.classList.add('is-empty');
                    }
                }

                icon.addEventListener('load', function () {
                    icon.classList.add('is-loaded');
                    fillWithArtwork(icon, icon.src);
                });
                icon.addEventListener('error', tryNext);
                tryNext();
            });
        })();
    </script>
</body>
</html>
