<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Nexus is the launcher for every system running on the Harith Kavish ecosystem.">
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1014" media="(prefers-color-scheme: dark)">
    <meta property="og:site_name" content="Harith Kavish">
    <meta property="og:title" content="Nexus">
    <meta property="og:description" content="Connected systems. One place.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nexus.harithkavish.com/">
    <meta property="og:image" content="https://nexus.harithkavish.com/logo.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Nexus">
    <meta name="twitter:description" content="Connected systems. One place.">
    <meta name="twitter:image" content="https://nexus.harithkavish.com/logo.png">
    <link rel="canonical" href="https://nexus.harithkavish.com/">
    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- The shared design system. Nexus adds only what the system does not have. -->
    <link rel="stylesheet" href="https://harithkavish.com/design-system/v1.0.0/tokens.css?v=20260829">
    <link rel="stylesheet" href="https://harithkavish.com/design-system/v1.0.0/base.css?v=20260829">
    <link rel="stylesheet" href="https://harithkavish.com/design-system/v1.0.0/components.css?v=20260829">
    <link rel="stylesheet" href="https://harithkavish.com/design-system/v1.0.0/utils.css?v=20260829">
    <script src="https://harithkavish.com/design-system/v1.0.0/theme-toggle.js?v=20260829"></script>
    <script src="https://harithkavish.com/design-system/v1.0.0/harith-shell.js?v=20260829"></script>
    <style>
        /* The only component the shared theme doesn't have: an app tile. Built from its tokens. */
        .app-grid {
            display: grid;
            /* Fixed tracks rather than 1fr, so tiles stay sized to the logo
               instead of stretching to fill the row. */
            grid-template-columns: repeat(auto-fill, min(100%, 170px));
            gap: 0.85rem;
        }

        /* The logo leads: centred, large, with the name reading as its caption. */
        .app-tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            min-width: 0;
            padding: 0.5rem 0.5rem 0.95rem;
            text-align: center;
            background: var(--surface);
            border: var(--border-hairline) solid var(--border);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
        }

        .app-tile:hover {
            transform: translateY(var(--lift-hover-card));
            box-shadow: var(--shadow-card-hover);
        }

        .app-tile__icon {
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            aspect-ratio: 1;
            max-width: 9.49rem;
        }

        /* Only for a system serving no icon, so its tile still reads as a tile. */
        .app-tile__icon.is-empty::after {
            content: '';
            width: 42%;
            height: 42%;
            border: var(--border-hairline) dashed var(--border);
            border-radius: var(--radius-card-small);
        }

        .app-tile__icon--search.is-empty {
            position: relative;
            color: var(--accent);
        }

        .app-tile__icon--search.is-empty::before {
            content: '';
            width: 48%;
            height: 48%;
            border: 0.42rem solid currentColor;
            border-radius: 50%;
        }

        .app-tile__icon--search.is-empty::after {
            content: '';
            position: absolute;
            width: 26%;
            height: 0.42rem;
            border: 0;
            border-radius: 999px;
            background: currentColor;
            transform: translate(44%, 44%) rotate(45deg);
            transform-origin: left center;
        }

        /* The site's own favicon, revealed only once it actually loads. */
        .app-tile__favicon {
            /* Fills the box rather than resting at its own intrinsic size. */
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 160ms ease;
        }

        .app-tile__favicon.is-loaded {
            opacity: 1;
        }

        .app-tile__text {
            display: flex;
            flex-direction: column;
            gap: 0.05rem;
            min-width: 0;
            max-width: 100%;
        }

        .app-tile__name {
            font-size: 1.05rem;
            font-weight: 650;
        }

        .app-tile__meta {
            color: var(--muted);
            font-size: 0.82rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
    <title>Nexus — Harith Kavish</title>
</head>
<body data-page="nexus">
    <div class="site-shell">
        <harith-header
            site-title="Harith Kavish"
            site-tagline="Nexus"
            brand-href="https://harithkavish.com/"
            brand-mark="/logo.png"></harith-header>

        <main class="site-main">
            <div class="section-head">
                <h1 class="section-head__title">Nexus</h1>
                <p class="section-head__lead">Connected systems. One place.</p>
            </div>

            <!-- Tiles are generated below, from the app list in the script. -->
            <div class="app-grid"></div>
        </main>

        <harith-footer
            copyright-text="Harith Kavish"
            links='[{"label":"Home","href":"https://harithkavish.com/"},{"label":"Status","href":"https://harithkavish.com/status.html"},{"label":"Legal","href":"https://harithkavish.com/legal.html"}]'></harith-footer>
    </div>

    <!-- The main site's ecosystem list, so a subdomain added there appears here too. -->
    <script src="https://harithkavish.com/site-data.js"></script>
    <script>
        (function () {
            /*
             * Tiles are built from data rather than markup. The list is the union of
             * the main site's ecosystem array — so a subdomain added there turns up
             * here with no edit — and a local list that keeps Nexus standing on its
             * own if that file is unreachable or restructured.
             */
            var LOCAL_APPS = [
                { slug: 'vm', name: 'VM' },
                { slug: 'vr', name: 'VR' },
                { slug: 'forge', name: 'Forge' },
                { slug: 'search', name: 'Search' },
                { slug: 'sites', name: 'Sites' },
                { slug: 'blog', name: 'Blog' },
                { slug: 'timeline', name: 'Timeline' },
                { slug: 'store', name: 'Store' },
                { slug: 'account', name: 'Account' },
                // Project sites on the main domain rather than subdomains of it,
                // so these carry an explicit href instead of deriving one.
                { slug: 'ai-lab', name: 'AI Chat', href: 'https://harithkavish.com/ai-lab/' },
                { slug: 'converse', name: 'Converse', href: 'https://harithkavish.com/converse/' }
            ];

            // The launcher never lists itself.
            var EXCLUDED = ['nexus'];

            // Systems whose icon is not served from their own root.
            var ICON_OVERRIDES = {
                search: 'https://search.harithkavish.com/ChatGPT%20Image%20Aug%2011%2C%202026%2C%2002_36_50%20AM.png',
                account: 'https://account.harithkavish.com/hk-account-logo.png',
                blog: 'https://harithkavish.com/favicon.svg',
                // Both ship a zero-byte favicon.ico and point at the main site's
                // mark in their own markup, so there is nothing of their own to
                // find. Replace these once either serves real artwork.
                'ai-lab': 'https://harithkavish.com/favicon.svg',
                converse: 'https://harithkavish.com/favicon.svg'
            };

            function describe(slug, name, href) {
                var url = (href || 'https://' + slug + '.harithkavish.com').replace(/\/+$/, '');
                return {
                    slug: slug,
                    name: name || slug,
                    url: url,
                    host: url.replace(/^https?:\/\//, '')
                };
            }

            function collectApps() {
                var bySlug = {};

                LOCAL_APPS.forEach(function (app) {
                    bySlug[app.slug] = describe(app.slug, app.name, app.href);
                });

                var shared = window.HarithSiteData && window.HarithSiteData.ecosystem;
                if (Array.isArray(shared)) {
                    shared.forEach(function (entry) {
                        if (entry && entry.slug && !bySlug[entry.slug]) {
                            bySlug[entry.slug] = describe(entry.slug, entry.name, entry.href);
                        }
                    });
                }

                return Object.keys(bySlug)
                    .filter(function (slug) {
                        return EXCLUDED.indexOf(slug) === -1;
                    })
                    .map(function (slug) {
                        return bySlug[slug];
                    })
                    .sort(function (first, second) {
                        return first.name.localeCompare(second.name, undefined, {
                            sensitivity: 'base',
                            numeric: true
                        });
                    });
            }

            function buildTile(app) {
                var tile = document.createElement('a');
                tile.className = 'app-tile';
                tile.href = app.url;
                tile.target = '_blank';
                tile.rel = 'noopener noreferrer';

                var iconBox = document.createElement('span');
                iconBox.className = 'app-tile__icon app-tile__icon--' + app.slug;
                iconBox.setAttribute('aria-hidden', 'true');

                var image = document.createElement('img');
                image.className = 'app-tile__favicon';
                image.alt = '';
                image.decoding = 'async';
                image.dataset.origin = app.url;
                if (ICON_OVERRIDES[app.slug]) {
                    image.dataset.iconSrc = ICON_OVERRIDES[app.slug];
                }
                iconBox.appendChild(image);

                var text = document.createElement('span');
                text.className = 'app-tile__text';

                var name = document.createElement('span');
                name.className = 'app-tile__name';
                name.textContent = app.name;

                var host = document.createElement('span');
                host.className = 'app-tile__meta';
                host.textContent = app.host;

                text.appendChild(name);
                text.appendChild(host);
                tile.appendChild(iconBox);
                tile.appendChild(text);
                return tile;
            }

            var grid = document.querySelector('.app-grid');
            if (grid) {
                var tiles = document.createDocumentFragment();
                collectApps().forEach(function (app) {
                    tiles.appendChild(buildTile(app));
                });
                grid.appendChild(tiles);
            }

            // Whatever icon a system serves, highest fidelity first: a vector, then
            // the large PNGs, leaving the usually-tiny .ico as a last resort.
            var iconPaths = [
                '/favicon.svg',
                '/icon.png',
                '/icon-512.png',
                '/icon-192.png',
                '/apple-touch-icon.png',
                '/apple-icon.png',
                '/favicon.png',
                '/favicon.ico'
            ];

            /*
             * Logos are drawn with varying amounts of blank margin baked into the
             * image. Measure where the artwork actually starts and ends, then scale
             * it so the artwork — not its canvas — fills the tile.
             */
            function fillWithArtwork(icon, src) {
                var probe = new Image();

                probe.addEventListener('load', function () {
                    var size = 64;
                    var width = probe.naturalWidth;
                    var height = probe.naturalHeight;
                    if (!width || !height) {
                        return;
                    }

                    try {
                        var canvas = document.createElement('canvas');
                        canvas.width = size;
                        canvas.height = size;
                        var context = canvas.getContext('2d', { willReadFrequently: true });

                        // Match how the tile draws it, so the bounds map straight across.
                        var fit = Math.min(size / width, size / height);
                        var drawWidth = width * fit;
                        var drawHeight = height * fit;
                        context.drawImage(
                            probe,
                            (size - drawWidth) / 2,
                            (size - drawHeight) / 2,
                            drawWidth,
                            drawHeight
                        );

                        var pixels = context.getImageData(0, 0, size, size).data;
                        var minX = size;
                        var minY = size;
                        var maxX = -1;
                        var maxY = -1;

                        for (var y = 0; y < size; y++) {
                            for (var x = 0; x < size; x++) {
                                if (pixels[(y * size + x) * 4 + 3] > 12) {
                                    if (x < minX) { minX = x; }
                                    if (x > maxX) { maxX = x; }
                                    if (y < minY) { minY = y; }
                                    if (y > maxY) { maxY = y; }
                                }
                            }
                        }

                        if (maxX < 0) {
                            return;
                        }

                        var scale = 1 / Math.max((maxX - minX + 1) / size, (maxY - minY + 1) / size);

                        // Already edge to edge, or so sparse that filling would distort it.
                        if (scale <= 1.02 || scale > 2.5) {
                            return;
                        }

                        var shiftX = ((minX + maxX + 1) / 2 / size - 0.5) * scale * 100;
                        var shiftY = ((minY + maxY + 1) / 2 / size - 0.5) * scale * 100;

                        icon.style.transform =
                            'translate(' + (-shiftX).toFixed(2) + '%, ' + (-shiftY).toFixed(2) + '%)' +
                            ' scale(' + scale.toFixed(3) + ')';
                    } catch (error) {
                        // The image blocked a pixel read, so it stays exactly as served.
                    }
                });

                // Measured on a separate request so a missing CORS header cannot
                // stop the visible logo from loading.
                probe.crossOrigin = 'anonymous';
                probe.src = src;
            }

            document.querySelectorAll('.app-tile__favicon').forEach(function (icon) {
                var origin = icon.dataset.origin;
                var customIconPaths = icon.dataset.iconSrc ? [icon.dataset.iconSrc] : [];
                var attempt = 0;
                var paths = customIconPaths.concat(iconPaths.map(function (path) {
                    return origin + path;
                }));

                function tryNext() {
                    if (attempt < paths.length) {
                        icon.src = paths[attempt++];
                    } else {
                        // Nothing served an icon, so the tile keeps an empty mark.
                        icon.parentNode.classList.add('is-empty');
                    }
                }

                icon.addEventListener('load', function () {
                    icon.classList.add('is-loaded');
                    fillWithArtwork(icon, icon.src);
                });
                icon.addEventListener('error', tryNext);
                tryNext();
            });
        })();
    </script>
</body>
</html>
